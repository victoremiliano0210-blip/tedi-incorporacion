<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tu primer mes en TEDI, paso a paso.">
<meta property="og:title" content="Incorporación TEDI"><meta property="og:description" content="Tu primer mes en TEDI, paso a paso.">
<meta name="theme-color" content="#0F6E6A"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Incorporación TEDI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna para celular (hasta 560px). Portada con banda institucional y ruta animada; acceso con codigo; ruta de 6 etapas; fichas tipo cajon que suben desde abajo; navegacion fija abajo. Tema institucional claro, unico a proposito. */
:root {
  --bg: #F3F5F7; --card: #FFFFFF; --ink: #12263A; --muted: #55667A; --line: #DCE3EA;
  --teal: #0F6E6A; --teal-d: #0A524F; --teal-dd: #083B39; --teal-l: #DCEFEC; --gold: #B8862A; --gold-l: #F6EEDB;
  --navy: #12263A; --navy-l: #E4E9EF; --lock: #9AA9B8; --lock-l: #E9EDF1; --violet: #4C4AA8; --violet-l: #ECECF8; --red: #B3402E; --red-l: #FBE9E5;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
a { color: var(--teal-d); }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-block: 12px 108px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.app.bare { padding-bottom: 32px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 7vw, 34px); }
h2 { font-size: 21px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ic { width: 22px; height: 22px; flex: none; }

/* entrada de cada vista: escalonada, solo al cambiar de pantalla */
.view-in > * { animation: rise 420ms var(--ease-out) both; }
.view-in > *:nth-child(2) { animation-delay: 50ms; } .view-in > *:nth-child(3) { animation-delay: 100ms; } .view-in > *:nth-child(4) { animation-delay: 150ms; }
.view-in > *:nth-child(5) { animation-delay: 200ms; } .view-in > *:nth-child(6) { animation-delay: 250ms; } .view-in > *:nth-child(n+7) { animation-delay: 300ms; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: rise 380ms var(--ease-out) both; }
.stagger > *:nth-child(2) { animation-delay: 45ms; } .stagger > *:nth-child(3) { animation-delay: 90ms; } .stagger > *:nth-child(4) { animation-delay: 135ms; }
.stagger > *:nth-child(5) { animation-delay: 180ms; } .stagger > *:nth-child(6) { animation-delay: 225ms; } .stagger > *:nth-child(n+7) { animation-delay: 270ms; }

/* portada */
.cover { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dd) 100%); color: #fff; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.cover .brandline { display: flex; align-items: center; gap: 10px; }
.brandmark { width: 38px; height: 38px; border-radius: 10px; background: #fff; color: var(--teal-d); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.cover .tag { font-size: 12px; font-weight: 600; background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 3px 10px; }
.cover h1 { font-size: clamp(28px, 8vw, 36px); color: #fff; }
.cover p { color: #CFE8E5; max-width: 40ch; }
.cover svg.trail { width: 100%; height: auto; margin-top: 4px; }
.trail .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1400ms var(--ease-in-out) 200ms forwards; }
.trail .dot { transform-box: fill-box; transform-origin: center; opacity: 0; animation: dot 420ms var(--ease-out) forwards; }
.trail .flagp { opacity: 0; animation: fade 400ms var(--ease-out) 1500ms forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dot { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.facts b { display: block; font-family: var(--display); font-size: 22px; font-weight: 600; }
.facts span { font-size: 12px; color: var(--muted); }

/* tarjetas y botones */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 12px; padding: 13px 20px; font-weight: 600; font-size: 16px; text-decoration: none; background: var(--teal); color: #fff; min-height: 50px; transition: transform 160ms var(--ease-out), background-color 200ms ease; }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--card); color: var(--teal-d); border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.btn[disabled] { cursor: default; }
.linkbtn { background: none; border: 0; color: var(--teal-d); font-weight: 600; cursor: pointer; padding: 10px 4px; text-decoration: underline; text-underline-offset: 3px; align-self: center; min-height: 44px; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--teal-d); }
  .btn.ghost:hover { background: var(--teal-l); }
  .char:hover, .act:hover, .item:hover { border-color: var(--teal); }
}
.tile { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--teal-l); color: var(--teal-d); }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); transition: transform 160ms var(--ease-out); }
.iconbtn:active { transform: scale(0.94); }

/* perfil */
.chars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.char { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 18px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; transition: border-color 200ms ease, box-shadow 200ms ease, transform 160ms var(--ease-out); }
.char:active { transform: scale(0.98); }
.char .tile { width: 48px; height: 48px; border-radius: 12px; transition: background-color 200ms ease, color 200ms ease; }
.char .tile .ic { width: 26px; height: 26px; }
.char b { font-family: var(--display); font-size: 18px; font-weight: 600; }
.char span { font-size: 13px; color: var(--muted); }
.char[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal), 0 6px 18px rgba(15, 110, 106, .14); }
.char[aria-pressed="true"] .tile { background: var(--teal); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 14px; font-weight: 500; cursor: pointer; font-size: 15px; min-height: 44px; transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, transform 160ms var(--ease-out); }
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

/* acceso */
.gate { text-align: left; }
.gate .lockicon { width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; }
.codefield { display: flex; flex-direction: column; gap: 6px; }
.codefield label { font-size: 13px; font-weight: 600; color: var(--muted); }
.codefield input { font: inherit; font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; text-align: center; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; min-height: 56px; transition: border-color 180ms ease, background-color 180ms ease; }
.codefield input:focus { border-color: var(--teal); background: #fff; outline: none; }
.codefield.err input { border-color: var(--red); background: var(--red-l); }
.codefield.err { animation: shake 320ms var(--ease-out); }
.codefield input.namein { font-family: var(--body); font-size: 17px; font-weight: 500; letter-spacing: 0; text-transform: none; text-align: left; margin-bottom: 8px; }
input.txt { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 46px; }
.bcode { font-family: var(--display); letter-spacing: .06em; }
.report { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 13px; line-height: 1.5; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 220px; overflow: auto; user-select: text; -webkit-user-select: text; }
.person { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: border-color 200ms ease, transform 160ms var(--ease-out); }
.person:active { transform: scale(0.98); }
.pav { width: 44px; height: 44px; border-radius: 50%; background: var(--navy-l); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.pt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pt b { font-weight: 600; font-size: 16px; }
.pt > span { font-size: 13px; color: var(--muted); }
.pt .bar { margin: 6px 0 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.s-late { background: var(--red-l); color: var(--red); }
.s-none { background: var(--navy-l); color: var(--muted); }
.addform { display: flex; flex-direction: column; gap: 8px; }
.addform label { font-size: 13px; font-weight: 600; color: var(--muted); }
.addform textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; resize: vertical; min-height: 96px; }
.tipbox { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.tipbox span { color: var(--muted); }
.tipbox.warn { border-left-color: var(--red); background: var(--red-l); }
.tipbox.warn span { color: var(--ink); }
.tipbox .linkbtn { align-self: flex-start; padding: 4px 0; min-height: 36px; }
/* preguntas */
.quiz { border-color: var(--teal); }
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.qdots { display: flex; gap: 4px; }
.qdots i { width: 18px; height: 4px; border-radius: 2px; background: var(--lock-l); }
.qdots i.on { background: var(--teal); } .qdots i.cur { background: var(--gold); }
.qtext { font-weight: 600; font-size: 16px; line-height: 1.4; }
.qopts { display: flex; flex-direction: column; gap: 8px; }
.qopt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: pointer; font-size: 15px; min-height: 48px; transition: border-color 180ms ease, background-color 180ms ease, transform 160ms var(--ease-out); }
.qopt:active { transform: scale(0.98); }
.qopt .qk { width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.qopt.sel { border-color: var(--teal); background: var(--teal-l); } .qopt.sel .qk { background: var(--teal); color: #fff; border-color: var(--teal); }
.qopt.right { border-color: var(--teal); background: var(--teal-l); } .qopt.right .qk { background: var(--teal); color: #fff; border-color: var(--teal); }
.qopt.wrong { border-color: var(--red); background: var(--red-l); } .qopt.wrong .qk { background: var(--red); color: #fff; border-color: var(--red); }
.qopt[disabled] { cursor: default; }
.qin { font-size: 16px; }
.qin.right { border-color: var(--teal); background: var(--teal-l); }
.qin.wrong { border-color: var(--red); background: var(--red-l); }
.qfb { font-size: 14px; border-radius: 10px; padding: 0; min-height: 0; display: flex; gap: 8px; align-items: flex-start; }
.qfb:empty { display: none; }
.qfb.ok { background: var(--teal-l); color: var(--teal-dd); padding: 10px 12px; animation: rise 260ms var(--ease-out) both; }
.qfb.err { background: var(--red-l); color: var(--red); padding: 10px 12px; animation: rise 260ms var(--ease-out) both; }
.qfb .ic { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.qform { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn[disabled] { background: var(--lock-l); color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wide2 { grid-column: 1 / -1; }
.char.wide2 { flex-direction: row; align-items: center; gap: 14px; }
.char.wide2 .ctext { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13px; color: var(--muted); }
.char.wide2 .ctext b { display: block; color: var(--ink); }
.stagelist { display: flex; flex-direction: column; gap: 6px; }
.stagelist div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stagelist div:last-child { border-bottom: 0; }
@media (hover: hover) and (pointer: fine) { .person:hover { border-color: var(--teal); } }
.codefield .msg { font-size: 14px; color: var(--red); font-weight: 500; min-height: 21px; }
.codefield .hint { font-size: 13px; color: var(--muted); }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.okmark { width: 72px; height: 72px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; align-self: center; animation: dot 360ms var(--ease-out) both; }
.okmark svg { width: 38px; height: 38px; }
.okmark path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 420ms var(--ease-out) 160ms forwards; }

/* barra de avance */
.hud { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; box-shadow: 0 2px 8px rgba(18, 38, 58, .06); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.hud .who { min-width: 0; flex: 1; }
.hud .name { font-weight: 600; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud .meta { font-size: 12px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--lock-l); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--teal); border-radius: 999px; transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform 700ms var(--ease-out); }
.pts { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.junta { font-size: 13px; font-weight: 600; color: var(--violet); background: var(--violet-l); border-radius: 10px; padding: 8px 12px; }

/* resumen de ruta */
.summary { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.ring { width: 84px; height: 84px; flex: none; position: relative; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring .track { stroke: var(--lock-l); }
.ring .val { stroke: var(--teal); stroke-linecap: round; transition: stroke-dashoffset 900ms var(--ease-out); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.summary .st { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.summary .st b { color: var(--teal-d); }

/* ruta */
.map { position: relative; }
.map.reveal .path { clip-path: inset(0 0 100% 0); animation: unclip 900ms var(--ease-in-out) 120ms forwards; }
@keyframes unclip { to { clip-path: inset(0 0 0 0); } }
.map svg.path { position: absolute; inset: 0; width: 100%; pointer-events: none; overflow: visible; }
.map.reveal .node, .map.reveal .label, .map.reveal .here-tag { animation: rise 420ms var(--ease-out) both; animation-delay: calc(200ms + var(--i) * 110ms); }
.node { position: absolute; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-family: var(--display); font-size: 24px; font-weight: 700; color: #fff; background: var(--teal); box-shadow: 0 0 0 5px var(--bg), 0 4px 12px rgba(18, 38, 58, .18); transition: transform 160ms var(--ease-out); }
.map.reveal .node { animation-name: nodein; }
@keyframes nodein { from { opacity: 0; transform: translate(-50%, -50%) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%); } }
.node:active { transform: translate(-50%, -50%) scale(.95); }
.node.done { background: var(--gold); }
.node.locked { background: var(--lock-l); color: var(--lock); box-shadow: 0 0 0 5px var(--bg); }
.node .ic { width: 28px; height: 28px; }
.halo { position: absolute; width: 68px; height: 68px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--teal); opacity: 0; pointer-events: none; animation: halo 2400ms var(--ease-out) 1200ms infinite; }
@keyframes halo { 0% { opacity: .28; transform: translate(-50%, -50%) scale(1); } 70%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } }
.here-tag { position: absolute; transform: translate(-50%, -100%); background: var(--navy); color: #fff; font-weight: 600; font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.map.reveal .here-tag { animation-name: tagin; }
@keyframes tagin { from { opacity: 0; transform: translate(-50%, calc(-100% + 6px)); } to { opacity: 1; transform: translate(-50%, -100%); } }
.label { position: absolute; transform: translateY(-50%); width: calc(50% - 64px); min-width: 120px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; transition: border-color 200ms ease; }
.map.reveal .label { animation-name: labelin; }
@keyframes labelin { from { opacity: 0; transform: translateY(calc(-50% + 8px)); } to { opacity: 1; transform: translateY(-50%); } }
.label b { display: block; font-family: var(--display); font-size: 16px; font-weight: 600; line-height: 1.2; }
.label span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.label.locked { opacity: .7; }
.dots { display: flex; gap: 3px; margin-top: 5px; }
.dots i { width: 14px; height: 4px; border-radius: 2px; background: var(--lock-l); }
.dots i.on { background: var(--gold); }

/* etapa */
.lvhead { display: flex; align-items: center; gap: 12px; }
.lvnum { width: 52px; height: 52px; border-radius: 14px; background: var(--teal); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 24px; font-weight: 700; flex: none; }
.callout { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 12px; padding: 14px; }
.callout .tile { width: 36px; height: 36px; }
.callout p { flex: 1; min-width: 0; }
.callout b { color: var(--teal-d); }
.act { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; transition: border-color 200ms ease, transform 160ms var(--ease-out); }
.act:active { transform: scale(0.98); }
.act .ai { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--teal-l); color: var(--teal-d); transition: background-color 300ms ease, color 300ms ease; }

/* reporte por WhatsApp y respaldo */
const fdate = ts => (typeof ts === "number" ? new Date(ts).toLocaleDateString("es-MX", { day: "numeric", month: "short" }) : "");

  const idx = Object.keys(espTable(S.perfil)).indexOf(espKey());
  return (S.perfil === "docente" ? "D" : S.perfil === "coordinacion" ? "C" : "A") + idx + "-" + bits.toString(36).toUpperCase() + "-" + localDay().toString(36).toUpperCase();
}
const localDay = (ts = Date.now()) => Math.floor((ts - new Date(ts).getTimezoneOffset() * 60000) / 864e5);
const routeFor = (p, e) => LEVELS.flatMap(L => [...COMUN.filter(s => s.m === L.k), ...(p === "docente" ? DOCENTE : p === "coordinacion" ? COORD : ADMIN).filter(s => s.m === L.k && fits(s.solo, e))]);

function reportPanel() {
  return `<section class="panel"><h2>Informar a mi jefa</h2><p class="small muted">Envía tu reporte de avance por WhatsApp. Se abre la aplicación con el mensaje listo; solo eliges a tu jefa inmediata.</p>
    <a class="btn wide" href="${esc(waLink())}" target="_blank" rel="noopener">${ic("chat")} Enviar mi avance por WhatsApp</a>
    <button class="btn ghost wide" data-copy="1">Copiar el reporte</button>
    <pre class="report" id="reporttext">${esc(summary())}</pre></section>`;
}

/* armado */
function hud() {
  const p = pct();
  return `<header class="hud"><span class="tile">${ic(S.perfil === "docente" ? "grad" : S.perfil === "coordinacion" ? "people" : "brief")}</span><div class="who"><p class="name">${esc(S.nombre || espName())}</p><p class="meta">${esc(S.nombre ? espName() : perfilName(S.perfil))} · ${esc(rank())} · ${p} %</p><div class="bar"><i data-bar="${(p / 100).toFixed(3)}" style="--p:${((lastPct ?? p) / 100).toFixed(3)}"></i></div></div><span class="pts" data-count="${ptsTotal()}">${lastPts ?? ptsTotal()} pts</span><button class="iconbtn" data-settings="1" aria-label="Ajustes">${ic("gear")}</button></header>${S.rev && S.dir ? `<p class="junta">Modo junta activo: cada actividad muestra su nota de revisión.</p>` : ""}`;
}
function navHtml(view) {
  const nx = nextAct();
  const b = (go, label, icon, cur) => `<li><button data-go="${go}" ${cur ? 'aria-current="page"' : ""}>${ic(icon)}<span>${label}</span></button></li>`;
  return `<ul><li><button data-change="1" aria-label="Salir al inicio y cambiar de perfil">${ic("home")}<span>Inicio</span></button></li>${b("ruta", "Ruta", "route", view === "ruta" || view === "etapa")}<li><button class="cont" ${nx ? `data-act="${nx.id}"` : 'data-go="avance"'}>${ic("next")}<span>Continuar</span></button></li>${b("documentos", "Documentos", "file", view === "documentos")}${b("avance", "Avance", "medal", view === "avance")}</ul>`;
}
function countUp(el, from, to) {
  if (reduced() || from === to) { el.textContent = `${to} pts`; return; }
  const t0 = performance.now(), dur = 700;
  const tick = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = `${Math.round(from + (to - from) * e)} pts`; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function settle() {
  const p = pct(), pts = ptsTotal();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll("[data-bar]").forEach(el => el.style.setProperty("--p", el.dataset.bar));
    const C = 2 * Math.PI * 34;
    document.querySelectorAll("[data-ring]").forEach(el => { el.style.strokeDashoffset = (C * (1 - +el.dataset.ring / 100)).toFixed(1); });
    document.querySelectorAll(".hud [data-count]").forEach(el => countUp(el, lastPts ?? pts, pts));
    lastPct = p; lastPts = pts;
  }));
}
function render(animate = false) {
  let h = (location.hash || "").slice(1);
  if (!S.dir && (h === "equipo" || h === "direccion")) h = "ruta";
  const dirView = S.dir && (h === "equipo" || h === "direccion");
  if (!dirView && (!S.perfil || !hasAccess(S.perfil) || h === "inicio")) h = "inicio";
  let view = h, arg = null;
  const m = h.match(/^etapa-(\d)$/);
  if (m) { view = "etapa"; arg = Math.min(+m[1], LEVELS.length - 1); }
  if (!V[view]) view = "ruta";
  const app = $("app");
  const solo = ["inicio", "equipo", "direccion"].includes(view);
  app.className = "app" + (solo ? " bare" : "") + (animate ? " view-in" : "");
  if (!animate) { app.querySelectorAll(".stagger").forEach(x => x.classList.remove("stagger")); }
  revealMap = animate;
  app.innerHTML = openTip(view) + (solo ? "" : hud()) + (view === "etapa" ? V.etapa(arg) : V[view]());
  if (!animate) app.querySelectorAll(".stagger").forEach(x => x.classList.remove("stagger"));
  const nav = $("nav");
  nav.hidden = solo;
  nav.innerHTML = solo ? "" : navHtml(view);
  if (view === "documentos" && $("bq")) { drawLib(); $("bq").addEventListener("input", drawLib); }
  if (view === "inicio" && (S.step === "code" || S.step === "dircode")) { const f = $("codeform"); f.addEventListener("submit", submitCode); setTimeout(() => ($("nombre") && !$("nombre").value ? $("nombre") : $("code")).focus(), 80); }
  if (view === "equipo") $("addform").addEventListener("submit", addPerson);
  if (!solo) settle(); else { lastPct = null; lastPts = null; }
  justId = null;
}
async function submitCode(e) {
  e.preventDefault();
  const dir = S.step === "dircode", field = $("codeform"), msg = $("codemsg"), btn = $("codebtn");
  const val = canon($("code").value);
  const nm = dir ? "" : ($("nombre").value || "").trim().replace(/\s+/g, " ").slice(0, 80);
  if (!dir && nm.length < 3) { msg.textContent = "Escribe tu nombre completo."; $("nombre").focus(); return; }
  if (!val) { msg.textContent = "Escribe tu código."; return; }
  if (!dir) S.nombre = nm;
  const h = await sha(val);
  if (!h) { msg.textContent = "Abre este enlace en un navegador actualizado para validar el código."; return; }
  const target = dir ? HASH.direccion : HASH[S.perfil];
  if (h === target || (!dir && h === HASH.direccion)) {
    if (dir || h === HASH.direccion) S.dir = true; else S.ok[S.perfil] = true;
    save();
    field.classList.remove("err");
    btn.disabled = true; btn.innerHTML = `${ic("check")} Acceso confirmado`;
    $("gate").insertAdjacentHTML("afterbegin", `<div class="okmark">${ic("check")}</div>`);
    $("gate").querySelector(".lockicon").remove();
    setTimeout(() => {
      S.step = "";
      if (dir) { if (location.hash === "#equipo") render(true); else location.hash = "#equipo"; }
      else { location.hash = "#ruta"; }
    }, reduced() ? 150 : 720);
  } else {
    field.classList.remove("err"); void field.offsetWidth; field.classList.add("err");
    msg.textContent = "El código no es válido. Revísalo o solicítalo a " + (dir ? "Calidad." : "Administración.");
    $("code").select();
  }
}
/* biblioteca: nivel 1 para todos, 2 o 3 segun el perfil, 4 solo con acceso de direccion; el nivel 5 no viaja en la pagina */
const libDocs = () => DOCS.filter(x => x.nivel.startsWith("1") || (S.perfil === "docente" && x.nivel.startsWith("2")) || (S.perfil === "administracion" && x.nivel.startsWith("3")) || (S.dir && /^[1-4]/.test(x.nivel)));
function drawLib() {
  const q = ($("bq").value || "").trim().toLowerCase();
  const mine = libDocs();
  const rows = mine.filter(x => !q || (x.nombre + " " + x.tema).toLowerCase().includes(q)).slice(0, q ? 66 : 6);
  $("blist").innerHTML = rows.map(x => `<a class="item ${S.opened[x.enlace] ? "opened" : ""}" href="${esc(x.enlace)}" target="_blank" rel="noopener" data-open="${esc(x.enlace)}"><span class="ii">${ic("file")}</span><span class="it"><b>${esc(x.nombre)}</b><span>${esc(x.tema)}</span></span>${ic("ext")}</a>`).join("") + (!q ? `<p class="small muted">Escribe para buscar entre los ${mine.length} documentos de tu perfil.</p>` : rows.length ? "" : `<p class="small muted">No hay documentos con esas palabras.</p>`);
}
const go = h => { closeSheet(true); if (location.hash === "#" + h) render(true); else location.hash = "#" + h; window.scrollTo(0, 0); };
document.addEventListener("click", e => {
  const t = e.target.closest("[data-perfil],[data-prog],[data-puesto],[data-go],[data-level],[data-act],[data-complete],[data-undo],[data-close],[data-settings],[data-change],[data-reset],[data-open],[data-start],[data-dirgate],[data-back-start],[data-logout],[data-copy],[data-restore],[data-person],[data-viewas],[data-premove],[data-coord],[data-qopt],[data-qcheck],[data-qnext],[data-qredo],[data-copylink],[data-tipok]");
  if (!t) return;
  const d = t.dataset;
  if (d.copy) {
    const txt = summary(), pre = $("reporttext");
    const fallback = () => { if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Texto seleccionado: cópialo con tu teléfono"); };
    try { navigator.clipboard.writeText(txt).then(() => toast("Reporte copiado"), fallback); } catch (err) { fallback(); }
    return;
  }
  if (d.qopt !== undefined) { if (QS && QS.phase === "ask") { QS.sel = +d.qopt; QS.err = false; drawQuiz(`[data-qopt="${d.qopt}"]`); } return; }
  if (d.tipok) { S.tipSeen = true; save(); render(false); return; }
  if (d.copylink) { try { navigator.clipboard.writeText(SITE_URL).then(() => toast("Enlace copiado: pégalo en Chrome o Safari"), () => toast(SITE_URL)); } catch (err) { toast(SITE_URL); } return; }
  if (d.qcheck) { checkQ(); return; }
  if (d.qnext) { nextQ(); return; }
  if (d.qredo) { delete S.quiz[QS.id]; save(); QS = { id: QS.id, i: 0, phase: "ask", sel: null, typed: "", tries: 0, err: false }; drawQuiz(); return; }
  if (d.person !== undefined) { personSheet(+d.person); return; }
  if (d.viewas) { S.perfil = d.viewas; save(); go("ruta"); return; }
  if (d.premove !== undefined) {
    if (!d.confirm) { t.dataset.confirm = "1"; t.textContent = "Confirmar: quitar del panel"; return; }
    const gone = S.team.splice(+d.premove, 1)[0]; save(); closeSheet(true); render(false); if (gone) toast(`Se quitó a ${gone.nombre}`); return;
  }
  if (d.restore) {
    const err = restoreCode($("restore").value);
    if (err) { $("restoremsg").textContent = err; return; }
    closeSheet(true); lastPct = null; lastPts = null; render(true); toast("Avance recuperado"); return;
  }
  if (d.close && t.classList.contains("scrim") && e.target !== t) return;
  if (d.open !== undefined) { S.opened[d.open] = true; save(); t.classList.add("opened"); return; }
  if (d.perfil) { S.perfil = d.perfil; save(); if (location.hash !== "#inicio") history.replaceState(null, "", "#inicio"); render(false); return; }
  if (d.prog) { S.prog = d.prog; save(); render(false); return; }
  if (d.puesto) { S.puesto = d.puesto; save(); render(false); return; }
  if (d.coord) { S.coord = d.coord; save(); render(false); return; }
  if (d.start) { if (hasAccess(S.perfil)) { location.hash = "#ruta"; } else { S.step = "code"; render(true); window.scrollTo(0, 0); } return; }
  if (d.dirgate) { if (S.dir) { toast("Acceso de dirección activo"); return; } S.step = "dircode"; render(true); window.scrollTo(0, 0); return; }
  if (d.backStart) { S.step = ""; render(true); return; }
  if (d.close) { closeSheet(); return; }
  if (d.settings) { settingsSheet(); return; }
  if (d.change) { closeSheet(true); S.step = ""; location.hash = "#inicio"; render(true); return; }
  if (d.logout) { S.ok = {}; S.dir = false; S.rev = false; S.unlock = false; save(); closeSheet(true); location.hash = "#inicio"; render(true); toast("Sesión cerrada"); return; }
  if (d.reset !== undefined) { if (d.reset === "0") { t.dataset.reset = "1"; t.textContent = "Confirmar: borrar mi avance"; return; } S.done = {}; S.opened = {}; S.quiz = {}; save(); lastPct = 0; lastPts = 0; go("ruta"); toast("Avance reiniciado"); return; }
  if (d.go) { go(d.go); return; }
  if (d.level !== undefined) { go("etapa-" + d.level); return; }
  if (d.act) { actSheet(d.act); return; }
  if (d.complete) {
    const st = all().find(s => s.id === d.complete), i = lvOf(st), was = lvDone(LEVELS[i].k);
    t.disabled = true; t.innerHTML = `<span class="draw">${ic("check")}</span> Completada`;
    setTimeout(() => {
      S.done[st.id] = Date.now(); justId = st.id; save(); closeSheet(); render(false); toast(`Actividad completada · +${ptsOf(st)} pts`);
      if (!was && lvDone(LEVELS[i].k)) setTimeout(() => stageDone(i), 700);
    }, reduced() ? 60 : 380);
    return;
  }
  if (d.undo) { delete S.done[d.undo]; save(); closeSheet(); render(false); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "t-rev") { S.rev = el.checked; save(); render(false); }
  else if (el.id === "t-unl") { S.unlock = el.checked; save(); render(false); }
  else if (el.id === "sel-esp") { if (S.perfil === "docente") S.prog = el.value; else if (S.perfil === "coordinacion") S.coord = el.value; else S.puesto = el.value; save(); render(false); }
  else if (el.id === "p-ingreso") { const p = S.team[+el.dataset.i]; if (p) { p.ingreso = el.value; save(); render(false); } }
  else if (el.id === "set-nombre") { const v = el.value.trim().replace(/\s+/g, " ").slice(0, 80); if (v.length >= 3) { S.nombre = v; save(); render(false); } }
});
document.addEventListener("submit", e => { if (e.target.id === "qform") { e.preventDefault(); checkQ(); } });
document.addEventListener("input", e => { if (e.target.id === "qin" && QS) { QS.typed = e.target.value; if (QS.err) { QS.err = false; e.target.classList.remove("wrong"); } } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.firstElementChild) closeSheet(); });
window.addEventListener("hashchange", () => { render(true); window.scrollTo(0, 0); });
render(true);

</script>
</body></html>
